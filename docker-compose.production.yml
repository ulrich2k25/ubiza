name: ubiza-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ubiza_postgres_production:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - ubiza_internal


  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      target: migrator

    restart: "no"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ubiza_internal


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      target: runner

    restart: unless-stopped
    init: true

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: 3002
      UPLOADS_DIR: /app/uploads
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    ports:
      - "127.0.0.1:3002:3002"

    volumes:
      - ubiza_uploads_production:/app/uploads

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - ubiza_internal


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production

      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MANUAL_PAYMENT_MTN_NUMBER: ${NEXT_PUBLIC_MANUAL_PAYMENT_MTN_NUMBER}
        NEXT_PUBLIC_MANUAL_PAYMENT_ORANGE_NUMBER: ${NEXT_PUBLIC_MANUAL_PAYMENT_ORANGE_NUMBER}

    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://backend:3002

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "127.0.0.1:3001:3001"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - ubiza_internal


volumes:
  ubiza_postgres_production:
  ubiza_uploads_production:


networks:
  ubiza_internal:
    driver: bridge
